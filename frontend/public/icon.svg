<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <rect width="512" height="512" rx="112" fill="#0b0f19" />
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="url(#cyanGradDark)" stroke-width="8" opacity="0.4" />

  <defs>
    <linearGradient id="cyanGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00bcd4" />
      <stop offset="100%" stop-color="#0288d1" />
    </linearGradient>
    <linearGradient id="textGradWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glowDark" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Cyan Glowing Dot -->
  <g transform="translate(20, 20)">
    <circle cx="84" cy="300" r="48" fill="#00bcd4" opacity="0.3" filter="url(#glowDark)" />
    <circle cx="84" cy="300" r="36" fill="url(#cyanGradDark)" />
    <circle cx="84" cy="300" r="16" fill="#ffffff" />
  </g>

  <!-- DEV Wordmark -->
  <text x="144" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="220" fill="url(#textGradWhite)" letter-spacing="-6">DEV</text>

  <!-- Prompt Accent Underline -->
  <rect x="150" y="365" width="100" height="14" rx="7" fill="url(#cyanGradDark)" />
</svg>
