<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 200" width="540" height="200" fill="none">
  <defs>
    <linearGradient id="cyanGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="textGradBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glowDark" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Cyan Dot / Terminal Indicator -->
  <g>
    <circle cx="70" cy="116" r="28" fill="#06b6d4" opacity="0.3" filter="url(#glowDark)" />
    <circle cx="70" cy="116" r="22" fill="url(#cyanGradDark)" />
    <circle cx="70" cy="116" r="10" fill="#ffffff" />
  </g>

  <!-- Main DEV Wordmark in Bright Slate/White -->
  <text x="114" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="142" fill="url(#textGradBright)" letter-spacing="-4">DEV</text>

  <!-- Prompt accent underline -->
  <rect x="118" y="164" width="60" height="8" rx="4" fill="url(#cyanGradDark)" />
</svg>
