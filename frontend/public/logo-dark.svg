<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 200" width="540" height="200" fill="none">
  <defs>
    <linearGradient id="cyanGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00bcd4" />
      <stop offset="100%" stop-color="#0288d1" />
    </linearGradient>
    <linearGradient id="textGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glowDark" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Cyan Dot / Terminal Indicator -->
  <g>
    <circle cx="70" cy="116" r="28" fill="#00bcd4" opacity="0.2" filter="url(#glowDark)" />
    <circle cx="70" cy="116" r="22" fill="url(#cyanGradDark)" />
    <circle cx="70" cy="116" r="10" fill="#ffffff" />
  </g>

  <!-- Main DEV Wordmark in Dark Slate -->
  <text x="114" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="142" fill="url(#textGradDark)" letter-spacing="-4">DEV</text>

  <!-- Prompt accent underline -->
  <rect x="118" y="164" width="60" height="8" rx="4" fill="url(#cyanGradDark)" />
</svg>
